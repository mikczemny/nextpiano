name: Next Piano 2 - build and device smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Theory model tests
        run: node tests/theory.test.js
      - name: Lint, MIDI unit tests, APK, AAB and instrumentation APK
        run: gradle --no-daemon lint testDebugUnitTest assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest
      - name: Package build and source
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/NextPiano-2.0.0-preview.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/NextPiano-2.0.0-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/NextPiano-2.0.0-unsigned.aab
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/instrumentation.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" artifacts/apksigner.jar
          git archive --format=zip HEAD -o artifacts/NextPiano-2.0.0-source.zip
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nextpiano-2-build
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextpiano-2-reports
          path: app/build/reports/
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 36
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: nextpiano-2-build
          path: artifacts
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          script: bash tests/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextpiano-2-emulator-api-${{ matrix.api }}
          path: device-results/
