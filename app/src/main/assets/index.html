<!doctype html>
<html lang="pl" data-theme="dark" data-palette="lavender">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Next Piano 2.0</title><link rel="stylesheet" href="styles.css">
<script defer src="theory.js"></script><script defer src="lessons.js"></script><script defer src="audio.js"></script><script defer src="app.js"></script>
</head><body>
<header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">▥</span><div>NEXT <b>PIANO</b><small>Twoje studio teorii i praktyki</small></div><span class="version">2.0</span></div><div class="header-actions"><span class="offline">● OFFLINE</span><button id="themeToggle" class="subtle" aria-label="Zmień jasny lub ciemny motyw">Jasny motyw</button><button id="panic" class="subtle">Wycisz wszystko</button></div></header>
<div class="shell"><nav class="navigation" aria-label="Moduły aplikacji">
<button data-view="studio" class="active">01 <span>Studio</span></button><button data-view="theory">02 <span>Biblioteka teorii</span></button><button data-view="ear">03 <span>Trener słuchu</span></button><button data-view="practice">04 <span>Ćwiczenia</span></button><button data-view="metro">05 <span>Metronom</span></button><button data-view="midi">06 <span>MIDI i ustawienia</span></button>
<div class="nav-note">Zrozum.<br>Usłysz.<br><strong>Zagraj.</strong><p>English note names<br>B, nie H · A4 = 440 Hz</p></div></nav>
<div class="workspace"><main id="content" tabindex="-1"></main>
<section class="piano-dock" aria-label="Grywalna klawiatura">
<div class="piano-toolbar"><div><strong id="liveName">Twoja klawiatura</strong><span id="liveNotes" class="muted">Dotknij klawisza lub podłącz MIDI</span></div><div class="piano-tools"><button id="octaveDown" aria-label="Oktawę niżej">−</button><span id="octaveLabel">C4</span><button id="octaveUp" aria-label="Oktawę wyżej">+</button><button id="sustain" aria-pressed="false">Sustain</button><button id="toggleKeyboard" aria-expanded="true">Schowaj</button></div></div>
<div id="keyboardWrap"><div id="piano" class="piano"></div><div class="keyboard-caption"><span><i class="dot scale-dot"></i>Skala <i class="dot chord-dot"></i>Akord <i class="dot live-dot"></i>Grasz teraz</span><span>A W S E D F T G Y H U J K · Space: sustain</span></div></div>
</section></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
